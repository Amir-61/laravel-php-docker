version: '3.8'

services:
  server:
    image: nginx:stable-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8000:80
  php:
    build: 
      context: ./dockerfiles
      target: php.dockerfile
    volumes:
      - ./src/:/var/www/html:delegated
  mysql:
    image: mysql:5.7
    env_file:
      - ./env/mysql.env

